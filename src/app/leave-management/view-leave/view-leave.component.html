<div *ngIf="leave; else loading">

  <h2>Leave Details</h2>

  <p><b>Leave Type:</b> {{ leave.leaveType }}</p>
  <p><b>From Date:</b> {{ leave.fromDate | date }}</p>
  <p><b>To Date:</b> {{ leave.toDate | date }}</p>
  <p><b>Status:</b> {{ leave.status }}</p>
  <p><b>Description:</b> {{ leave.description }}</p>

</div>

<ng-template #loading>
  <p>Loading leave details...</p>
</ng-template>
